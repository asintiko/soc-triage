[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-triage"
version = "0.1.0"
description = "First-pass triage of logs and suspicious emails: normalised events, YAML detection rules mapped to MITRE ATT&CK, HTML and Markdown reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitriy Kvasnikov" }]
keywords = ["soc", "blue-team", "log-analysis", "phishing", "mitre-attack", "dfir"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
analyzer = "soc_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
